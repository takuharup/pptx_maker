paths:
  db_path: data/work/database.db
  python_exe: python        # Embedded Python の場合はフルパスに変更
  input_dir: data/input
  work_dir: data/work
  output_dir: data/output

# Phase 1 で使用する CSV の列名（変更した場合はここを修正）
csv:
  required_columns:
    - ケース番号
    - 設定ファイル名
    - 設定条件
    - 最大高さ
    - 90%高さ
    - ガスホールドアップ

# VBA が確認する必須シェイプ名（テンプレート PPTX と合わせること）
pptx:
  required_shapes:
    - TXT_ConfigFile
    - TXT_Conditions
    - TXT_Dispersion
    - TXT_GasHU
    - IMG_Main
    - IMG_Graph1
    - IMG_Graph2

logging:
  level: INFO
